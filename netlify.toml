[build]
  publish = "."
  functions = ".netlify/functions"

[[redirects]]
  from = "/api/evaluate"
  to = "/.netlify/functions/evaluate"
  status = 200

[[redirects]]
  from = "/api/support"
  to = "/.netlify/functions/support"
  status = 200

[[redirects]]
  from = "/api/community-votes"
  to = "/.netlify/functions/community-votes"
  status = 200

[[redirects]]
  from = "/api/database"
  to = "https://buro-startapov-api.onrender.com/api/database"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
