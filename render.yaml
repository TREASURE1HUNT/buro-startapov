databases:
  - name: buro-startapov-db
    databaseName: buro_startapov
    user: buro_startapov
    plan: free
    region: oregon
    postgresMajorVersion: "18"

services:
  - type: web
    name: buro-startapov-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: corepack pnpm install --frozen-lockfile
    startCommand: node render-server.mjs
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: buro-startapov-db
          property: connectionString
      - key: NODE_VERSION
        value: "22"
      - key: INFERENCE_API_KEY
        sync: false
      - key: INFERENCE_BASE_URL
        value: https://inference.dahl.global/v1
      - key: INFERENCE_MODEL
        value: MiniMaxAI/MiniMax-M2.7
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
  - type: web
    name: buro-startapov-admin
    runtime: node
    plan: free
    region: oregon
    buildCommand: corepack pnpm install --frozen-lockfile
    startCommand: node render/admin-server.mjs
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: buro-startapov-db
          property: connectionString
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_API_TOKEN
        sync: false
      - key: SITE_API_URL
        value: https://buro-startapov-api.onrender.com/health
      - key: INFERENCE_API_KEY
        fromService:
          name: buro-startapov-api
          type: web
          envVarKey: INFERENCE_API_KEY
      - key: INFERENCE_BASE_URL
        value: https://inference.dahl.global/v1
